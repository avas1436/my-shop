# قوانین توزیع بار روی قسمت های مختلف
http:
  middlewares:
    # ============================================
    # Rate Limiters
    # ============================================
    rate-limit-strict:
      rateLimit:
        average: 10
        period: 1m
        burst: 20
        sourceCriterion:
          ipStrategy: { depth: 1 }

    rate-limit-normal:
      rateLimit:
        average: 100
        period: 1m
        burst: 200
        sourceCriterion:
          ipStrategy: { depth: 1 }

    rate-limit-auth:
      rateLimit:
        average: 5
        period: 1m
        burst: 10
        sourceCriterion:
          ipStrategy: { depth: 1 }

    rate-limit-bot:
      rateLimit:
        average: 300
        period: 1m
        burst: 500
        sourceCriterion:
          requestHeaderName: "User-Agent"

    rate-limit-seo:
      rateLimit:
        average: 500
        period: 1m
        burst: 1000

    # ← جدید: محدودیت مخصوص GET های شلوغ
    rate-limit-read-heavy:
      rateLimit:
        average: 500
        period: 1m
        burst: 800
        sourceCriterion:
          ipStrategy: { depth: 1 }

    # ============================================
    # Security Headers
    # ============================================
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        forceSTSHeader: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "geolocation=(), microphone=(), camera=()"
        customResponseHeaders:
          Server: ""
          X-Permitted-Cross-Domain-Policies: "none"

    seo-headers:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "all"
          Cache-Control: "public, max-age=3600"
          Vary: "Accept-Encoding"

    bot-headers:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "all"
          Cache-Control: "public, max-age=1800"
          Vary: "User-Agent"

    # ← جدید: هدرهای کش برای read-heavy
    read-heavy-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=300, stale-while-revalidate=60"
          Vary: "Accept-Encoding, Accept-Language"

    # ============================================
    # Compression
    # ============================================
    compress:
      compress:
        minResponseBodyBytes: 1024
        excludedContentTypes:
          - "image/png"
          - "image/jpeg"
          - "image/gif"
          - "video/mp4"

    # ============================================
    # Authentication
    # ============================================
    auth-admin:
      basicAuth:
        users:
          - "admin:$$apr1$$H6uskkkW$$IgXLP7T6rq8w5E4QzX8J/0"
        removeHeader: true

    # ============================================
    # Timeouts
    # ============================================
    timeout-short:
      forwardingTimeouts:
        dialTimeout: 3s
        responseHeaderTimeout: 5s

    timeout-long:
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 15s

    # ← جدید: تایم‌اوت مخصوص read-heavy (بین short و long)
    timeout-read:
      forwardingTimeouts:
        dialTimeout: 3s
        responseHeaderTimeout: 10s

    # ============================================
    # Buffering (DDoS Protection)
    # ============================================
    buffering:
      buffering:
        maxRequestBodyBytes: 10485760
        memRequestBodyBytes: 2097152
        maxResponseBodyBytes: 10485760
        memResponseBodyBytes: 2097152
        retryExpression: "IsNetworkError() && Attempts() <= 2"

    # ============================================
    # Circuit Breaker
    # ============================================
    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 600, 0, 600) > 0.25"
        checkPeriod: 100ms
        fallbackDuration: 10s
        recoveryDuration: 30s

  # ============================================
  # Middleware Chains
  # ============================================
  chains:
    admin-chain:
      middlewares:
        - rate-limit-strict
        - security-headers
        - timeout-short
        - buffering

    user-chain:
      middlewares:
        - rate-limit-normal
        - security-headers
        - compress
        - timeout-short
        - buffering

    auth-chain:
      middlewares:
        - rate-limit-auth
        - security-headers
        - timeout-short
        - buffering

    public-chain:
      middlewares:
        - rate-limit-normal
        - timeout-short

    bot-chain:
      middlewares:
        - rate-limit-bot
        - bot-headers
        - compress
        - timeout-long

    seo-chain:
      middlewares:
        - rate-limit-seo
        - seo-headers
        - compress
        - timeout-short

    frontend-chain:
      middlewares:
        - rate-limit-normal
        - security-headers
        - compress

    # ← جدید: Chain مخصوص GET های شلوغ Axum
    read-heavy-chain:
      middlewares:
        - rate-limit-read-heavy
        - read-heavy-headers
        - compress
        - timeout-read
        - circuit-breaker
