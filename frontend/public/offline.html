<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آفلاین - دسترسی به اینترنت قطع است</title>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
      body {
        margin: 0;
        padding: 0;
        font-family: 'Vazirmatn', sans-serif;
        background-color: #f8fafc;
        color: #334155;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .container {
        background: white;
        padding: 3rem 2rem;
        border-radius: 1rem;
        box-shadow:
          0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);
        max-width: 400px;
        width: 90%;
      }
      .icon {
        color: #0f766e;
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        animation: pulse 2s infinite;
      }
      h1 {
        font-size: 1.5rem;
        color: #0f766e;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #64748b;
        margin-bottom: 1.5rem;
      }
      .btn {
        background-color: #0f766e;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-family: inherit;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s;
        text-decoration: none;
      }
      .btn:hover {
        background-color: #115e59;
      }
      @keyframes pulse {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(0.95);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- SVG Icon for Offline/Disconnected -->
      <svg
        class="icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M18.364 5.636a9 9 0 00-12.728 0M12 21a9.003 9.003 0 008.716-6.747M12 21a9.003 9.003 0 01-8.716-6.747M15.536 8.464a5 5 0 00-7.072 0m7.072 0l3-3m-7.072 3l-3-3m7.072 7.072l-3 3m0-3l-3 3"
        ></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"></path>
      </svg>
      <h1>ارتباط قطع شد!</h1>
      <p>
        به نظر می‌رسد در حال حاضر به اینترنت متصل نیستید. نگران نباشید، به محض برقراری مجدد ارتباط،
        می‌توانید به فروشگاه برگردید.
      </p>
      <button class="btn" onclick="window.location.reload()">تلاش مجدد</button>
    </div>
  </body>
</html>
