<!-- index.html  -->
<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- عنوان -->
    <title>فروشگاه دالر تری</title>

    <!-- آیکون -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Theme رنگی برای موبایل -->
    <meta name="theme-color" content="#0f766e" />

    <!-- توضیح کوتاه برای SEO -->
    <meta name="description" content="فروشگاه آنلاین با تجربه سریع و امن خرید" />

    <!-- Open Graph برای اشتراک‌گذاری در فضای مجازی -->
    <meta property="og:title" content="ShopVerse" />
    <meta property="og:description" content="فروشگاه آنلاین با تجربه سریع و امن خرید" />
    <meta property="og:image" content="/cover.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />

    <!-- Twitter Card برای اشتراک گذاری در تویتر-->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShopVerse" />
    <meta name="twitter:description" content="فروشگاه آنلاین با تجربه سریع و امن خرید" />
    <meta name="twitter:image" content="/cover.png" />

    <!-- Preconnect (برای وصل شدن سریع به آدرس ها) -->
    <!-- <link rel="preconnect" href="https://api.example.com" /> -->
  </head>
  <body>
    <noscript>برای نمایش سایت لطفاً JavaScript را فعال کنید.</noscript>

    <!-- ریشه اپ -->
    <div id="app"></div>

    <!-- ورودی اصلی Vite -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
