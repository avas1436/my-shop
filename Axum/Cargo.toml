[package]
name = "ax"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", registry = "devneeds" }

dotenvy = { version = "0.15.7", registry = "devneeds" }
serde = { version = "1.0.228", registry = "devneeds" }
serde_json = { version = "1.0.149", registry = "devneeds" }
tokio = { version = "1.52.3", features = ["full"], registry = "devneeds" }
tracing = { version = "0.1.44", registry = "devneeds" }
tracing-subscriber = { version = "0.3.23", registry = "devneeds" }

# Postgres
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres"], registry = "devneeds"}

# Redis
deadpool-redis = { version = "0.23.0", registry = "devneeds" }

# Swagger
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] ,registry = "devneeds" }
utoipa = { version = "5.5.0", registry = "devneeds", features = ["axum_extras"] }
