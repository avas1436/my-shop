version: "3.9"

# تعریف متغیر برای استفاده در طول استک
# use: <<: *backend-env
# تعریف محیط بک اند
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://avas@postgres:5432/shop
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
  ENVIRONMENT: production

# تعریف فایل لاگر
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

# در داکر سوارم، هر بخش یک سرویس است
services:
  # ============================================
  # TRAEFIK - Reverse Proxy & Security Layer - دروازه ورود به کلاستر
  # ============================================
  traefik:
    image: traefik:v3.0
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--log.level=WARN"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
      - "--accesslog.fields.defaultmode=keep"
      - "--accesslog.fields.headers.defaultmode=keep"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.X-Forwarded-For=keep"
      - "--accesslog.fields.headers.names.Authorization=drop"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      - "--providers.swarm=true" # برای ترافیک تعریف میکنیم الان کجایی
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=traefik-public" # شبکه ای که ترافیک در آن کار میکند
      - "--providers.swarm.refreshseconds=15"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=avas.com"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.avas.com"
      - "--certificatesresolvers.letsencrypt.acme.email=zade@avas.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--global.sendanonymoususage=false"
      - "--ping=true"

    # این دو پورت روی سرور باز میشوند
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/logs/traefik:/var/log/traefik:rw
      - ./docker/traefik/acme.json:/acme.json:rw

    deploy:
      placement:
        constraints: [node.role == manager] # ترافیک نیاز به دسترسی مدیر دارد
      resources:
        # حداقل و حداکثر منابع مورد نیاز ترافیک
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
      restart_policy:
        # اگر ترافیک کرش کرد برای سه بار با فاصله زمانی 5 ثانیه رفرش شود
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.avas.com`)"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.middlewares=auth-admin@file"

    networks: [traefik-public]
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]

  # ============================================
  # FASTAPI - Admin & User APIs
  # ============================================
  backend:
    image: fast-api:latest
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --log-level info
      --access-log
      --proxy-headers
      --forwarded-allow-ips=*

    environment:
      <<: *backend-env

    secrets:
      - db_password
      - redis_password
      - jwt_secret

    volumes:
      - ./docker/logs/backend:/app/logs:rw
      - backend-media:/app/media

    deploy:
      replicas: 3
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      resources:
        limits: { cpus: "2.0", memory: 1G }
        reservations: { cpus: "0.5", memory: 256M }
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        # Admin API - محدودیت سخت
        - "traefik.http.routers.backend-admin.rule=Host(`api.avas.com`) && PathPrefix(`/api/v1/admin`)"
        - "traefik.http.routers.backend-admin.entrypoints=websecure"
        - "traefik.http.routers.backend-admin.middlewares=admin-chain@file"
        # User API
        - "traefik.http.routers.backend-user.rule=Host(`api.avas.com`) && PathPrefix(`/api/v1`)"
        - "traefik.http.routers.backend-user.entrypoints=websecure"
        - "traefik.http.routers.backend-user.middlewares=user-chain@file"
        # Auth API - محدودیت خیلی سخت
        - "traefik.http.routers.backend-auth.rule=Host(`api.avas.com`) && PathPrefix(`/api/v1/auth`)"
        - "traefik.http.routers.backend-auth.entrypoints=websecure"
        - "traefik.http.routers.backend-auth.middlewares=auth-chain@file"
        # Public endpoints
        - "traefik.http.routers.backend-public.rule=Host(`api.avas.com`) && (PathPrefix(`/health`) || PathPrefix(`/metrics`) || PathPrefix(`/docs`))"
        - "traefik.http.routers.backend-public.entrypoints=websecure"
        - "traefik.http.routers.backend-public.middlewares=public-chain@file"
        - "traefik.http.services.backend.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik-public"

    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

    networks: [traefik-public, internal]
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # ============================================
  # AXUM - Public Bot and Heavy Get Handler
  # ============================================
  axum:
    image: axum:latest
    command: ["./axum-server"]

    environment:
      - DATABASE_URL=postgresql://avas@postgres:5432/shop
      - REDIS_URL=redis://redis:6379/0
      - RUST_LOG=info
      - SERVER_PORT=8080
      - ALLOWED_BOTS=Googlebot,Torob,bingbot,YandexBot

    secrets:
      - db_password
      - redis_password

    volumes:
      - ./docker/logs/axum:/app/logs:rw

    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        # Bot Routes
        - "traefik.http.routers.axum-bot.rule=Host(`api.avas.com`) && (PathPrefix(`/public/products`) || PathPrefix(`/public/sitemap`) || PathPrefix(`/public/feed`))"
        - "traefik.http.routers.axum-bot.entrypoints=websecure"
        - "traefik.http.routers.axum-bot.middlewares=bot-chain@file"
        # SEO Routes
        - "traefik.http.routers.axum-seo.rule=Host(`avas.com`,`www.avas.com`) && (Path(`/sitemap.xml`) || Path(`/robots.txt`) || Path(`/feed.xml`))"
        - "traefik.http.routers.axum-seo.entrypoints=websecure"
        - "traefik.http.routers.axum-seo.middlewares=seo-chain@file"
        - "traefik.http.services.axum.loadbalancer.server.port=8080"
        - "traefik.docker.network=traefik-public"

    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

    networks: [traefik-public, internal]
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    image: vue-frontend:latest

    volumes:
      - ./docker/logs/frontend:/var/log/nginx:rw

    deploy:
      replicas: 3
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { cpus: "0.1", memory: 64M }
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`example.com`,`www.example.com`)"
        - "traefik.http.routers.frontend.entrypoints=websecure"
        - "traefik.http.routers.frontend.middlewares=frontend-chain@file"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"

    networks: [traefik-public, web]
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]

  # ============================================
  # CELERY WORKER
  # ============================================
  celery_worker:
    image: fast-api:latest
    command: >
      celery -A app.core.celery_conf:celery_app worker
      -l warning
      -c 4
      --max-tasks-per-child 1000

    environment:
      - REDIS_BROKER_URL=redis://redis:6379/1
      - REDIS_BACKEND_URL=redis://redis:6379/3

    depends_on:
      redis: { condition: service_healthy }

    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
      restart_policy:
        condition: on-failure

    networks: [internal]
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # ============================================
  # FLOWER
  # ============================================
  flower:
    image: fast-api:latest
    command: >
      celery -A app.core.celery_conf:celery_app flower
      --port=5555

    environment:
      - REDIS_BROKER_URL=redis://redis:6379/1
      - REDIS_BACKEND_URL=redis://redis:6379/3
      - FLOWER_BASIC_AUTH=admin:secure-password

    depends_on:
      redis: { condition: service_healthy }

    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.flower.rule=Host(`flower.example.com`)"
        - "traefik.http.routers.flower.entrypoints=websecure"
        - "traefik.http.routers.flower.middlewares=auth-admin@file"
        - "traefik.http.services.flower.loadbalancer.server.port=5555"

    networks: [internal, traefik-public]
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]

  # ============================================
  # POSTGRES
  # ============================================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=avas
      - POSTGRES_DB=shop
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets: [db_password]
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avas -d shop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  # ============================================
  # REDIS
  # ============================================
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
    volumes: [redisdata:/data]
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.1", memory: 64M }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  traefik-public: { external: true }
  web: { external: true }
  internal: { external: true, internal: true }

volumes:
  pgdata: { driver: local }
  redisdata: { driver: local }
  backend-media: { driver: local }

secrets:
  db_password: { file: ./secrets/db_password.txt }
  redis_password: { file: ./secrets/redis_password.txt }
  jwt_secret: { file: ./secrets/jwt_secret.txt }
