version: "3.9"

services:
  # ===== Traefik =====
  traefik:
    image: traefik:latest

    command:
      - "--api=true"
      - "--api.dashboard=true"
      - --log.level=DEBUG

      # Swarm Provider
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=traefik-public"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

    deploy:
      placement:
        constraints:
          - node.role == manager

    networks:
      - traefik-public

  # ===== Vue =====
  frontend:
    build:
      context: ./frontend

    image: vue:latest

    deploy:
      replicas: 1
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`example.com`)"
        - "traefik.http.routers.frontend.entrypoints=web"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"

    networks:
      - traefik-public
      - web

  # ===== FastAPI =====
  backend:
    build:
      context: ./backend

    image: fast-api:latest

    deploy:
      replicas: 1
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.backend.rule=Host(`api.example.com`)"
        - "traefik.http.routers.backend.entrypoints=web"
        - "traefik.http.services.backend.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.services.backend.loadbalancer.passhostheader=true"

    networks:
      - traefik-public
      # - web
      - internal

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db

    secrets:
      - postgres_user
      - postgres_password
      - postgres_db

    volumes:
      - pgdata:/var/lib/postgresql/data

    deploy:
      replicas: 1

    networks:
      - internal

  # ===== Redis =====
  redis:
    image: redis:7-alpine

    command:
      - sh
      - -c
      - |
        redis-server --requirepass "$$(cat /run/secrets/redis_password)"

    secrets:
      - redis_password

    volumes:
      - redisdata:/data
    deploy:
      replicas: 1

    networks:
      - internal

# ===== Network =====
networks:
  traefik-public:
    driver: overlay

  web:
    driver: overlay

  internal:
    driver: overlay
    internal: true

# ===== Volume =====
volumes:
  pgdata:
  redisdata:

# ===== secrets =====
secrets:
  redis_password:
    external: true

  postgres_user:
    external: true

  postgres_password:
    external: true

  postgres_db:
    external: true
