# آدرس سرویس
host = http://127.0.0.1:8000

# تعداد کاربران و نرخ رشد
users = 1000
spawn-rate = 60

# مدت تست
run-time = 5m

# اجرا بدون محیط گرافیکی
# headless = true
headless = false

# تولید گزارش CSV
csv = reports/report
csv-full-history = true

# زمان انتظار برای توقف
stop-timeout = 30

# سطح لاگ
loglevel = INFO

# وقتی کاربرد دارد که بخواهیم تنها برخی تگ های خاص اجرا شوند
# به این صورت بالای توابع قرار میگیرد @tag("smoke")
# tags = smoke
# exclude-tags = slow

# خروجی JSON برای CI
# json = reports/report.json
